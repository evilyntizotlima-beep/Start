<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<style>
    header {
      background-color: #183C63;
      color: #ffffff;
      text-align: center;
      margin: 0 auto;
      padding: 16px;
      border: 5px solid #69c7f3;
    }

    main {
      background-color: #98caf0;
      color: #183C63;
      text-align: center;
      margin: 0 auto;
      padding: 16px;
      display: flex;

    }

    img {
      width: 80px;
      height: 80px;
    }

    .artigo-autor {
      font-weight: bold;
    }
  </style>

<body>
  <h1>MEU BLOG TECH</h1>
  <p>vou compartilhar conhecimento sobre tecnologia</p>
  <main>
    <img src="meu blog.jpg" alt="meu blog">
    <div>
    <h2>meu primeiro post</h2>
    <p class="artigo-autor">por: Evillyn Tizot</p>Aqui vou compartilhar dicas de programação e curiosidade da área de tecnologia.
    <p>Boas-vindas ao meu novo blog! </p>
    <button>❤️  <span>0</span></button>
    <button>👍 <span>0</span></button>
  </div>
  </main>
</body>
<script>
  const botoes = document.querySelectorAll("button");

  botoes.forEach(function (botao) {
    botao.addEventListener("click", botaoClicado);

    function botaoClicado() {
      console.log("fui clicado");
      let texto = botao.querySelector("span");
      texto.textContent++;
    }
  });
</script>
</html>
